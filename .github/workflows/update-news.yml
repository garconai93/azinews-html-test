# Preia știrile la fiecare oră și le salvează în data/ (fără push --force)
name: AziNews Update

on:
  schedule:
    - cron: '42 * * * *'  # în fiecare oră, la minutul 42
  workflow_dispatch:

# un singur job care scrie în repo rulează la un moment dat (știri sau horoscop)
concurrency:
  group: azinews-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Update news
        run: |
          python3 update_news.py
          python3 generate_rss.py

      - name: Commit and push
        run: |
          git config --local user.email "garconaibot@gmail.com"
          git config --local user.name "GitHub Actions"
          git add data feed.xml
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
