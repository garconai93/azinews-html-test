name: Horoscop Zilnic

on:
  schedule:
    - cron: '42 4 * * *'  # 6:42/7:42 ora României
  workflow_dispatch:

concurrency:
  group: azinews-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update horoscope
        run: python3 update_horoscope.py

      - name: Commit and push
        run: |
          git config --local user.email "garconaibot@gmail.com"
          git config --local user.name "GitHub Actions"
          git add data/horoscope.json
          git diff --staged --quiet && exit 0
          git commit -m "Horoscop zilnic $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
